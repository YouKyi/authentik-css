# Ce fichier remplace le boilerplate Auto-DevOps genere par l'UI GitLab.
#
# Pourquoi le retirer : ce depot n'a JAMAIS eu de pipeline. Le workflow:rules
# d'Auto-DevOps ecarte les pipelines quand ni Dockerfile ni buildpack n'est detecte.
# Les 14 stages qu'il declarait (build, deploy, review, dast, canary, production,
# rollouts incrementaux, performance, cleanup) etaient vides, avec un risque dormant :
# une variable de registre ou de cluster au niveau groupe aurait suffi a allumer des
# jobs de deploiement sur ce depot.
#
# Le SAST n'y trouvait rien non plus : aucun langage qu'il sait analyser.
#
# Ce qui reste utile, et qui manquait : la detection de secrets, bloquante et lisible.
include:
  - component: $CI_SERVER_FQDN/YouKyi-Infra/ci-infrastructure/ci-catalog/gitleaks-scan@v2.1.0
    inputs:
      # PAS le defaut .pre : les jobs de .pre et .post ne s'executent QUE s'il existe
      # au moins un autre job dans le pipeline. Ce depot n'ayant que ce seul job, un
      # pipeline uniquement compose de .pre est considere comme VIDE par GitLab, qui
      # refuse alors de le creer.
      stage: lint
  - component: $CI_SERVER_FQDN/YouKyi-Infra/ci-infrastructure/ci-catalog/trivy-vuln@v2.1.0
    inputs:
      stage: lint
  - component: $CI_SERVER_FQDN/YouKyi-Infra/ci-infrastructure/ci-catalog/trivy-secret@v2.1.0
    inputs:
      stage: lint
  - component: $CI_SERVER_FQDN/YouKyi-Infra/ci-infrastructure/ci-catalog/trivy-license@v2.1.0
    inputs:
      stage: lint

stages:
  - lint
